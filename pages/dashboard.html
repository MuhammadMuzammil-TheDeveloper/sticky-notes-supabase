<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sticky Notes – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../stylesheet/dashboard.css">
</head>
<body>

  <div class="dashboard-shell">

    <!-- Sidebar -->
    <aside class="sidebar fade-in">
      <div class="sidebar-header">
        <div class="sidebar-logo">📌</div>
        <div class="sidebar-title">
          <span>Sticky <b>Notes</b></span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="notes">
          <span class="nav-icon">📋</span>
          <span>Notes</span>
        </button>
        <button class="nav-item" data-view="trash">
          <span class="nav-icon">🗑️</span>
          <span>Trash</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon">⚙️</span>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">A</div>
          <div class="user-meta">
            <span class="user-name" id="userName">Loading…</span>
            <span class="user-email" id="userEmail"></span>
          </div>
        </div>
        <button id="logoutBtn" class="btn outline ripple">
          <span class="logout-icon">⎋</span> Logout
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-area fade-in">

      <header class="top-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchNotes" placeholder="Search notes...">
          <kbd class="search-kbd">Ctrl + K</kbd>
        </div>

        <div class="top-bar-actions">
          <button id="themeToggle" class="icon-circle-btn ripple" aria-label="Toggle theme">☀️</button>
          <button id="notifBtn" class="icon-circle-btn ripple" aria-label="Notifications">🔔</button>
          <button id="deleteAllNotes" class="btn primary pill ripple">Delete All</button>
        </div>
      </header>

      <section class="page-heading">
        <h1>All Notes</h1>
        <p id="noteCount">0 notes</p>
      </section>

      <section id="emptyState" class="empty-state" hidden>
        <div class="empty-card">
          <div class="empty-icon">📝</div>
          <h3>No notes yet</h3>
          <p>Click the "+" button to create your first sticky note.</p>
        </div>
      </section>

      <section id="notesGrid" class="notes-grid">
        <!-- Notes are rendered here by dashboard.js -->
      </section>

      <!-- Floating New Note button -->
      <button id="addNoteFab" class="fab ripple" aria-label="Add note">
        <span>+</span>
      </button>
    </main>
  </div>

  <!-- Note modal -->
  <div id="noteModal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content slide-up">
      <div class="modal-header">
        <h3 id="modalTitle">New Note</h3>
        <button id="closeModal" class="icon-btn ripple">&times;</button>
      </div>
      <div class="modal-body">
        <div class="floating-group">
          <input type="text" id="noteTitle" required placeholder=" ">
          <label for="noteTitle">Title</label>
        </div>
        <div class="floating-group">
          <textarea id="noteContent" rows="4" required placeholder=" "></textarea>
          <label for="noteContent">Content</label>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveNoteBtn" class="btn primary ripple">Save Note</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../script/dashboard.js"></script>

  <!-- Cosmetic-only behavior (theme toggle / sidebar nav highlight). -->
  <!-- Does not touch data logic — that stays in dashboard.js -->
  <script>
    (function () {
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => {
        item.addEventListener('click', () => {
          navItems.forEach(i => i.classList.remove('active'));
          item.classList.add('active');
        });
      });

      const themeToggle = document.getElementById('themeToggle');
      themeToggle.addEventListener('click', () => {
        const dark = document.body.classList.toggle('theme-dark');
        themeToggle.textContent = dark ? '🌙' : '☀️';
      });
    })();
  </script>
</body>
</html>
